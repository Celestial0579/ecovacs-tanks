name: Prüfen

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: integration
          ignore: brands
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Die Action startet bewusst das jeweils aktuelle hassfest-Abbild.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Testanforderungen installieren
        run: pip install -r requirements_test.txt
      - name: Tests
        run: pytest tests
  tests-mindestfassung:
    name: Tests (Mindestfassung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/validate.yml
      # Die Mindestfassung aus hacs.json, dazu der deebot-client aus ihrem Ecovacs-Manifest. Fest hier
      # und nicht in requirements_test.txt, damit Dependabot sie nicht anhebt; mit hacs.json anheben.
      # Home Assistant vor 2026.1 legt pycares nicht fest, und sein aiodns 3.5 scheitert an pycares 5.
      - name: Mindestfassung installieren
        run: pip install pytest-homeassistant-custom-component==0.13.294 deebot-client==16.3.0 "pycares<5"
      - name: Fassung gegen hacs.json prüfen
        run: python -c 'import json, homeassistant.const as c; m = json.load(open("hacs.json"))["homeassistant"]; assert c.__version__ == m, (c.__version__, m)'
      - name: Tests
        run: pytest tests
